services:
  - type: web
    name: on-tickets-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash entrypoint.sh gunicorn on_tickets_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "on-tickets-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://on-tickets.vercel.app"
      - key: ADMIN_EMAIL
        value: "admin@ontickets.com"
      - key: ADMIN_PASSWORD
        value: "troque-esta-senha"
      - key: DATABASE_URL
        fromDatabase:
          name: on-tickets-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: on-tickets-db
    plan: free
    region: oregon
